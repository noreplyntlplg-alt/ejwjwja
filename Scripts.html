<script>
let STATE={public:null,session:null,portal:null,view:'home'};
const $=id=>document.getElementById(id);
function busy(v){$('loading').classList.toggle('show',v)}
function run(fn,...args){return new Promise((resolve,reject)=>{busy(true);google.script.run.withSuccessHandler(r=>{busy(false);resolve(r)}).withFailureHandler(e=>{busy(false);Swal.fire({icon:'error',title:'ไม่สามารถดำเนินการได้',text:e.message||e});reject(e)})[fn](...args)})}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmtDate(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'})}
function statusBadge(s){let c='';if(['อนุมัติ','ผ่านการคัดเลือก','สอบผ่าน','เอกสารครบถ้วน','มีสิทธิ์สอบ','ยืนยันสิทธิ์'].includes(s))c='success';else if(['ปฏิเสธ','เอกสารไม่สมบูรณ์'].includes(s))c='danger';else if(['รอตรวจสอบ','รอชำระ','รอตรวจสอบเอกสาร'].includes(s))c='warn';return `<span class="badge ${c}">${esc(s||'-')}</span>`}
function showHome(){STATE.view='home';renderHome()}
async function init(){try{STATE.public=await run('getPublicData');applyBrand(STATE.public.settings);renderHome()}catch(e){}}
function applyBrand(s){$('brandName').textContent=s.schoolName||'ระบบรับสมัครนักเรียน';$('footerName').textContent=s.schoolName||'ระบบรับสมัครนักเรียน';if(s.schoolLogoData){$('brandLogo').src=s.schoolLogoData;$('brandLogo').classList.remove('hidden')}}
function renderHome(){const p=STATE.public||{settings:{},rounds:[],programs:[]};const rounds=p.rounds||[];const programs=p.programs||[];$('app').innerHTML=`<div class="container"><section class="hero"><div><h1>${esc(p.settings.systemOpenMessage||'ระบบรับสมัครนักเรียน')}</h1><p>${esc(p.settings.schoolName||'กรุณาตั้งชื่อโรงเรียน')}<br>${esc(p.settings.homeNotice||'')}</p><div class="actions"><button class="btn btn-gold" onclick="openRegister()"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิกผู้สมัคร</button><button class="btn btn-outline" style="background:#fff" onclick="openStudentLogin()"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button></div></div></section><h2 class="section-title">ประกาศและรายละเอียดการรับสมัคร</h2><div class="notice">${esc(p.settings.homeNotice||'ยังไม่มีประกาศ')}</div><h2 class="section-title">รอบรับสมัครที่เปิดอยู่</h2><div class="grid">${rounds.length?rounds.map(r=>roundCard(r,programs)).join(''):'<div class="card empty">ขณะนี้ยังไม่มีรอบรับสมัครที่เปิดให้สมัคร</div>'}</div><h2 class="section-title">แผนการเรียนและจำนวนรับ</h2><div class="grid">${programs.length?programs.map(programCard).join(''):'<div class="card empty">ยังไม่มีข้อมูลแผนการเรียน</div>'}</div></div>`}
function roundCard(r,programs){const ps=programs.filter(p=>String(p.roundId)===String(r.roundId));return `<div class="card round-card"><h3>${esc(r.roundName)}</h3><div>ปีการศึกษา ${esc(r.academicYear)}</div><div>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</div><div>วันสอบ: ${fmtDate(r.examDate)}</div><div>ค่าธรรมเนียม: ${Number(r.applicationFee||0).toLocaleString()} บาท</div><div class="help">${esc(r.description||'')}</div><button class="btn btn-primary" onclick="openRegister('${esc(r.roundId)}')">สมัครรอบนี้</button></div>`}
function programCard(p){const rem=Math.max(0,Number(p.capacity||0)-Number(p.usedCapacity||0));const pct=Math.min(100,Number(p.capacity||0)?Number(p.usedCapacity||0)/Number(p.capacity)*100:0);return `<div class="card"><h3>${esc(p.programName)}</h3><div>ประเภท: ${esc(p.programType||'-')}</div><div>โควตา: ${esc(p.quotaName||'-')}</div><div>รับ ${Number(p.capacity||0)} คน · เหลือ ${rem} คน</div><div class="capacity"><span style="width:${pct}%"></span></div><div class="help">${esc(p.description||'')}</div></div>`}
function modal(title,body){$('app').insertAdjacentHTML('beforeend',`<div class="modal open" id="modal"><div class="modal-box"><div class="modal-title"><span>${title}</span><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`)}function closeModal(){$('modal')?.remove()}
function openStudentLogin(){modal('เข้าสู่ระบบผู้สมัคร',`<form onsubmit="studentLogin(event)" class="form-card"><div class="field"><label class="required">หมายเลขบัตรประจำตัวประชาชน 13 หลัก</label><input id="loginCitizen" maxlength="13" inputmode="numeric" pattern="[0-9]{13}" required></div><p class="help">ผู้สมัครต้องสมัครสมาชิกก่อนจึงจะเข้าสู่ระบบได้</p><div class="actions"><button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button><button type="button" class="btn btn-light btn-block" onclick="openRegister()">ยังไม่มีบัญชี · สมัครสมาชิก</button></div></form>`)}
async function studentLogin(e){e.preventDefault();const r=await run('loginStudent',$('loginCitizen').value);STATE.session=r;closeModal();await loadStudent()}
function openRegister(roundId=''){const rounds=STATE.public?.rounds||[];if(!rounds.length){Swal.fire({icon:'info',title:'ยังไม่มีรอบรับสมัคร',text:'ผู้ดูแลระบบต้องเพิ่มและเปิดรอบรับสมัครก่อน'});return}const first=roundId||rounds[0].roundId;modal('สมัครสมาชิกผู้สมัคร',`<form onsubmit="registerStudent(event)" class="form-card"><div class="form-grid"><div class="field full"><label class="required">รอบรับสมัคร</label><select id="regRound" required>${rounds.map(r=>`<option value="${esc(r.roundId)}" ${String(r.roundId)===String(first)?'selected':''}>${esc(r.roundName)} · ปี ${esc(r.academicYear)} · ${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</option>`).join('')}</select></div><div class="field"><label class="required">หมายเลขบัตรประจำตัวประชาชน</label><input id="regCitizen" maxlength="13" inputmode="numeric" required></div><div class="field"><label class="required">ชื่อ</label><input id="regFirst" required></div><div class="field"><label class="required">นามสกุล</label><input id="regLast" required></div><div class="field"><label class="required">วันเดือนปีเกิด</label><input id="regBirth" type="date" required></div><div class="field"><label>เพศ</label><select id="regGender"><option value="">ไม่ระบุ</option><option>ชาย</option><option>หญิง</option></select></div><div class="field"><label class="required">เบอร์โทรศัพท์</label><input id="regPhone" required></div><div class="field"><label>อีเมล</label><input id="regEmail" type="email"></div><div class="field full"><label class="required">ที่อยู่</label><textarea id="regAddress" required></textarea></div><div class="field"><label>ตำบล/แขวง</label><input id="regSub"></div><div class="field"><label>อำเภอ/เขต</label><input id="regDist"></div><div class="field"><label>จังหวัด</label><input id="regProv"></div><div class="field"><label>รหัสไปรษณีย์</label><input id="regPost"></div><div class="field"><label class="required">ชื่อผู้ปกครอง</label><input id="regParent" required></div><div class="field"><label>ความสัมพันธ์</label><input id="regRelation" placeholder="เช่น บิดา มารดา ผู้ปกครอง"></div><div class="field"><label>อาชีพผู้ปกครอง</label><input id="regOcc"></div><div class="field"><label class="required">เบอร์ผู้ปกครอง</label><input id="regParentPhone" required></div><div class="field"><label class="required">โรงเรียนเดิม</label><input id="regSchool" required></div><div class="field"><label>จังหวัดโรงเรียนเดิม</label><input id="regSchoolProv"></div><div class="field"><label>เกรดเฉลี่ย</label><input id="regGpa" type="number" min="0" max="4" step="0.01"></div></div><div class="actions"><button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิก</button></div></form>`)}
async function registerStudent(e){e.preventDefault();const d={roundId:$('regRound').value,citizenId:$('regCitizen').value,firstName:$('regFirst').value,lastName:$('regLast').value,birthDate:$('regBirth').value,gender:$('regGender').value,phone:$('regPhone').value,email:$('regEmail').value,address:$('regAddress').value,subdistrict:$('regSub').value,district:$('regDist').value,province:$('regProv').value,postalCode:$('regPost').value,parentName:$('regParent').value,parentRelation:$('regRelation').value,parentOccupation:$('regOcc').value,parentPhone:$('regParentPhone').value,previousSchool:$('regSchool').value,previousProvince:$('regSchoolProv').value,gpa:$('regGpa').value};const r=await run('registerStudent',d);closeModal();await Swal.fire({icon:'success',title:'สมัครสมาชิกสำเร็จ',text:r.message});openStudentLogin()}
async function loadStudent(){STATE.portal=await run('getStudentPortal',STATE.session.token);applyBrand(STATE.portal.settings);renderStudentShell('dashboard')}
function logout(){STATE.session=null;STATE.portal=null;location.reload()}
function renderStudentShell(page){const p=STATE.portal;const menus=[['dashboard','fa-house','ภาพรวม'],['application','fa-file-pen','ใบสมัครเรียน'],['documents','fa-folder-open','เอกสารประกอบ'],['payment','fa-money-bill-wave','ชำระค่าธรรมเนียม'],['status','fa-list-check','ตรวจสอบสถานะ'],['exam','fa-id-card','บัตรประจำตัวสอบ']];$('topActions').innerHTML=`<button class="btn btn-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>`;$('app').innerHTML=`<div class="portal"><aside class="sidebar"><h3>${esc(p.student.firstName+' '+p.student.lastName)}</h3>${menus.map(m=>`<button class="nav-btn" onclick="studentPage('${m[0]}')"><i class="fa-solid ${m[1]}"></i>${m[2]}</button>`).join('')}<button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button></aside><section class="content" id="portalContent"></section></div>`;studentPage(page)}
function studentPage(page){STATE.view=page;const c=$('portalContent');if(page==='dashboard')return studentDashboard(c);if(page==='application')return studentApplication(c);if(page==='documents')return studentDocuments(c);if(page==='payment')return studentPayment(c);if(page==='status')return studentStatus(c);if(page==='exam')return studentExam(c)}
function studentDashboard(c){const apps=STATE.portal.applications||[];c.innerHTML=`<h1 class="section-title">ภาพรวมผู้สมัคร</h1><div class="stat-grid"><div class="stat"><div>จำนวนใบสมัคร</div><div class="num">${apps.length}</div></div><div class="stat"><div>มีสิทธิ์สอบ</div><div class="num">${apps.filter(a=>a.examStatus==='มีสิทธิ์สอบ').length}</div></div><div class="stat"><div>ผ่านการคัดเลือก</div><div class="num">${apps.filter(a=>a.resultStatus==='ผ่านการคัดเลือก').length}</div></div><div class="stat"><div>ยืนยันสิทธิ์</div><div class="num">${apps.filter(a=>a.resultStatus==='ยืนยันสิทธิ์').length}</div></div></div><h2 class="section-title">ประกาศ</h2><div class="notice">${esc(STATE.portal.settings.homeNotice||'')}</div><h2 class="section-title">ใบสมัครของฉัน</h2>${apps.length?apps.map(appSummary).join(''):'<div class="card empty">ยังไม่มีใบสมัคร กรุณาเลือกเมนู “ใบสมัครเรียน” เพื่อเริ่มต้น</div>'}`}
function appSummary(a){const confirm=a.resultStatus==='ผ่านการคัดเลือก'?'<button class="btn btn-success" data-id="'+esc(a.applicationId)+'" onclick="confirmAdmission(this.dataset.id)">ยืนยันสิทธิ์</button>':'';return '<div class="card" style="margin-bottom:10px"><h3>'+esc(a.round?.roundName||'-')+'</h3><div>เลขที่ใบสมัคร: <b>'+esc(a.applicationNo)+'</b></div><div>แผนการเรียน: '+esc(a.program?.programName||'-')+'</div><div>สถานะ: '+statusBadge(a.applicationStatus)+'</div><div class="actions"><button class="btn btn-outline" onclick="studentPage(\'status\')">ดูสถานะ</button>'+confirm+'</div></div>'}
function studentApplication(c){const existing=STATE.portal.applications||[];const rounds=STATE.portal.rounds||[];const programs=STATE.portal.programs||[];if(existing.length){c.innerHTML='<h1 class="section-title">กรอกใบสมัครเรียน</h1>'+existing.map(appSummary).join('');return}const roundOptions=rounds.map(r=>'<option value="'+esc(r.roundId)+'">'+esc(r.roundName)+' · ปี '+esc(r.academicYear)+'</option>').join('');c.innerHTML='<h1 class="section-title">กรอกใบสมัครเรียน</h1><div class="form-card"><form onsubmit="submitApplication(event)"><div class="form-grid"><div class="field full"><label class="required">รอบรับสมัคร</label><select id="appRound" onchange="filterProgramOptions()" required>'+roundOptions+'</select></div><div class="field full"><label class="required">แผนการเรียน / สายการเรียน / โควตา</label><select id="appProgram" required></select></div><div class="field"><label class="required">ชื่อ</label><input id="appFirst" value="'+esc(STATE.portal.student.firstName)+'" required></div><div class="field"><label class="required">นามสกุล</label><input id="appLast" value="'+esc(STATE.portal.student.lastName)+'" required></div><div class="field"><label class="required">วันเดือนปีเกิด</label><input id="appBirth" type="date" value="'+String(STATE.portal.student.birthDate||'').slice(0,10)+'" required></div><div class="field"><label>เพศ</label><select id="appGender"><option value="">ไม่ระบุ</option><option '+(STATE.portal.student.gender==='ชาย'?'selected':'')+'>ชาย</option><option '+(STATE.portal.student.gender==='หญิง'?'selected':'')+'>หญิง</option></select></div><div class="field"><label class="required">เบอร์โทรศัพท์</label><input id="appPhone" value="'+esc(STATE.portal.student.phone)+'" required></div><div class="field"><label>อีเมล</label><input id="appEmail" value="'+esc(STATE.portal.student.email)+'"></div><div class="field full"><label class="required">ที่อยู่</label><textarea id="appAddress" required>'+esc(STATE.portal.student.address)+'</textarea></div><div class="field"><label>ตำบล/แขวง</label><input id="appSub" value="'+esc(STATE.portal.student.subdistrict)+'"></div><div class="field"><label>อำเภอ/เขต</label><input id="appDist" value="'+esc(STATE.portal.student.district)+'"></div><div class="field"><label>จังหวัด</label><input id="appProv" value="'+esc(STATE.portal.student.province)+'"></div><div class="field"><label>รหัสไปรษณีย์</label><input id="appPost" value="'+esc(STATE.portal.student.postalCode)+'"></div><div class="field"><label class="required">ชื่อผู้ปกครอง</label><input id="appParent" value="'+esc(STATE.portal.student.parentName)+'" required></div><div class="field"><label>ความสัมพันธ์</label><input id="appRelation" value="'+esc(STATE.portal.student.parentRelation)+'"></div><div class="field"><label>อาชีพ</label><input id="appOcc" value="'+esc(STATE.portal.student.parentOccupation)+'"></div><div class="field"><label class="required">เบอร์ผู้ปกครอง</label><input id="appParentPhone" value="'+esc(STATE.portal.student.parentPhone)+'" required></div><div class="field"><label class="required">โรงเรียนเดิม</label><input id="appSchool" value="'+esc(STATE.portal.student.previousSchool)+'" required></div><div class="field"><label>จังหวัดโรงเรียนเดิม</label><input id="appSchoolProv" value="'+esc(STATE.portal.student.previousProvince)+'"></div><div class="field"><label>เกรดเฉลี่ย</label><input id="appGpa" value="'+esc(STATE.portal.student.gpa)+'" type="number" min="0" max="4" step="0.01"></div></div><div class="card" style="margin-top:14px;background:#f8fafc"><b>ความยินยอม PDPA</b><p>'+esc(STATE.portal.settings.pdpaText||'')+'</p><label><input type="checkbox" id="pdpa" required> ข้าพเจ้ายินยอมตามข้อความข้างต้น</label></div><div class="actions"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> ส่งใบสมัคร</button></div></form></div>';filterProgramOptions()}
function filterProgramOptions(){const ps=(STATE.portal.programs||[]).filter(p=>String(p.roundId)===String($('appRound')?.value));$('appProgram').innerHTML=ps.map(p=>'<option value="'+esc(p.programId)+'" '+(Number(p.remaining)<=0?'disabled':'')+'>'+esc(p.programName)+' · เหลือ '+Number(p.remaining||0)+' คน</option>').join('')||'<option value="">ไม่มีแผนการเรียน</option>'}
async function submitApplication(e){e.preventDefault();const d={roundId:$('appRound').value,programId:$('appProgram').value,firstName:$('appFirst').value,lastName:$('appLast').value,birthDate:$('appBirth').value,gender:$('appGender').value,phone:$('appPhone').value,email:$('appEmail').value,address:$('appAddress').value,subdistrict:$('appSub').value,district:$('appDist').value,province:$('appProv').value,postalCode:$('appPost').value,parentName:$('appParent').value,parentRelation:$('appRelation').value,parentOccupation:$('appOcc').value,parentPhone:$('appParentPhone').value,previousSchool:$('appSchool').value,previousProvince:$('appSchoolProv').value,gpa:$('appGpa').value,pdpaConsent:$('pdpa').checked};const r=await run('createApplication',STATE.session.token,d);await Swal.fire({icon:'success',title:'ส่งใบสมัครสำเร็จ',text:'เลขที่ใบสมัคร '+r.applicationNo});await loadStudent()}
function studentDocuments(c){const apps=STATE.portal.applications||[];const docsFor=a=>[['รูปถ่าย','รูปถ่ายผู้สมัคร','image'],['บัตรประชาชน','สำเนาบัตรประชาชน','doc'],['ทะเบียนบ้าน','สำเนาทะเบียนบ้าน','doc'],['ปพ.1','ปพ.1 / ใบแสดงผลการเรียน','doc']].map(x=>{const d=(a.documents||[]).find(z=>z.documentType===x[0]);return '<div class="file-row"><div><b>'+x[1]+'</b><br>'+(d?statusBadge(d.verificationStatus):'<span class="badge warn">ยังไม่อัปโหลด</span>')+(d&&d.verificationNote?'<div class="help">หมายเหตุ: '+esc(d.verificationNote)+'</div>':'')+'</div><div><label class="btn btn-outline"><i class="fa-solid fa-upload"></i> เลือกไฟล์<input type="file" class="hidden" data-app="'+esc(a.applicationId)+'" data-type="'+esc(x[0])+'" accept="'+(x[2]==='image'?'.jpg,.jpeg,.png,.webp':'.pdf,.jpg,.jpeg,.png,.webp')+'" onchange="uploadDoc(event,this.dataset.app,this.dataset.type)"></label></div></div>'}).join('');c.innerHTML='<h1 class="section-title">อัปโหลดเอกสาร</h1>'+apps.map(a=>'<div class="form-card" style="margin-bottom:14px"><h3>'+esc(a.applicationNo)+' · '+esc(a.program?.programName||'')+'</h3><div class="file-list">'+docsFor(a)+'</div></div>').join('')||'<div class="card empty">ยังไม่มีใบสมัคร</div>'}
async function uploadDoc(e,appId,type){const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){Swal.fire({icon:'error',title:'ไฟล์ใหญ่เกินกำหนด',text:'รองรับไม่เกิน 8 MB'});return}const base=await fileToBase64(f);await run('uploadDocument',STATE.session.token,{applicationId:appId,documentType:type,fileName:f.name,mimeType:f.type,base64:base});Swal.fire({icon:'success',title:'อัปโหลดสำเร็จ'});await loadStudent();studentPage('documents')}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function studentPayment(c){const apps=STATE.portal.applications||[];const paymentFor=a=>{const fee=Number(a.round?.applicationFee||0),pay=a.payment;return '<div class="form-card" style="margin-bottom:14px"><h3>'+esc(a.applicationNo)+'</h3><div>ค่าธรรมเนียม: <b>'+fee.toLocaleString()+' บาท</b></div><div>สถานะ: '+statusBadge(a.paymentStatus)+'</div><hr><form data-app="'+esc(a.applicationId)+'" data-fee="'+fee+'" onsubmit="submitPayment(event,this.dataset.app,Number(this.dataset.fee))"><div class="form-grid"><div class="field"><label>จำนวนเงิน</label><input id="payAmount_'+esc(a.applicationId)+'" type="number" value="'+(pay?.amount||fee)+'" required></div><div class="field"><label>เลขอ้างอิง</label><input id="payRef_'+esc(a.applicationId)+'" value="'+esc(pay?.referenceNo||'')+'"></div><div class="field"><label>วันที่โอน</label><input id="payDate_'+esc(a.applicationId)+'" type="date" required></div><div class="field"><label>เวลาโอน</label><input id="payTime_'+esc(a.applicationId)+'" type="time"></div><div class="field full"><label class="required">แนบสลิปการโอน</label><input id="payFile_'+esc(a.applicationId)+'" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf" required></div></div><button class="btn btn-primary" type="submit"><i class="fa-solid fa-money-bill-transfer"></i> แจ้งชำระเงิน</button></form></div>'};c.innerHTML='<h1 class="section-title">ชำระค่าธรรมเนียม</h1>'+apps.map(paymentFor).join('')||'<div class="card empty">ยังไม่มีใบสมัคร</div>'}
async function submitPayment(e,appId,fee){e.preventDefault();const f=$('payFile_'+appId).files[0];if(!f){Swal.fire({icon:'warning',title:'กรุณาแนบสลิป'});return}const base=await fileToBase64(f);await run('uploadPaymentSlip',STATE.session.token,{applicationId:appId,amount:$('payAmount_'+appId).value,referenceNo:$('payRef_'+appId).value,bankDate:$('payDate_'+appId).value,bankTime:$('payTime_'+appId).value,fileName:f.name,mimeType:f.type,base64:base});Swal.fire({icon:'success',title:'แจ้งชำระเงินแล้ว'});await loadStudent();studentPage('payment')}
async function uploadDoc(e,appId,type){const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){Swal.fire({icon:'error',title:'ไฟล์ใหญ่เกินกำหนด',text:'รองรับไม่เกิน 8 MB'});return}const base=await fileToBase64(f);await run('uploadDocument',STATE.session.token,{applicationId:appId,documentType:type,fileName:f.name,mimeType:f.type,base64:base});Swal.fire({icon:'success',title:'อัปโหลดสำเร็จ'});await loadStudent();studentPage('documents')}
function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function submitPayment(e,appId,fee){e.preventDefault();const f=$('payFile_'+appId).files[0];if(!f){Swal.fire({icon:'warning',title:'กรุณาแนบสลิป'});return}const base=await fileToBase64(f);await run('uploadPaymentSlip',STATE.session.token,{applicationId:appId,amount:$('payAmount_'+appId).value,referenceNo:$('payRef_'+appId).value,bankDate:$('payDate_'+appId).value,bankTime:$('payTime_'+appId).value,fileName:f.name,mimeType:f.type,base64:base});Swal.fire({icon:'success',title:'แจ้งชำระเงินแล้ว'});await loadStudent();studentPage('payment')}
async function confirmAdmission(id){const r=await Swal.fire({icon:'question',title:'ยืนยันสิทธิ์',text:'เมื่อยืนยันแล้ว ระบบจะบันทึกผลเป็นยืนยันสิทธิ์',showCancelButton:true,confirmButtonText:'ยืนยัน',cancelButtonText:'ยกเลิก'});if(!r.isConfirmed)return;await run('confirmAdmission',STATE.session.token,id);await Swal.fire({icon:'success',title:'ยืนยันสิทธิ์สำเร็จ'});await loadStudent();studentPage('status')}
function studentStatus(c){const apps=STATE.portal.applications||[];c.innerHTML=`<h1 class="section-title">ตรวจสอบสถานะ</h1>${apps.map(a=>`<div class="card" style="margin-bottom:12px"><h3>${esc(a.applicationNo)} · ${esc(a.program?.programName||'')}</h3><div class="grid-2"><div>สถานะใบสมัคร<br>${statusBadge(a.applicationStatus)}</div><div>เอกสาร<br>${statusBadge(a.documentStatus)}</div><div>การชำระเงิน<br>${statusBadge(a.paymentStatus)}</div><div>การสอบ<br>${statusBadge(a.examStatus)}</div><div>ผลคัดเลือก<br>${statusBadge(a.resultStatus)}</div><div>เลขที่นั่งสอบ<br><b>${esc(a.seatNo||'-')}</b></div></div></div>`).join('')||'<div class="card empty">ยังไม่มีข้อมูลสถานะ</div>'}`}
function studentExam(c){const apps=(STATE.portal.applications||[]).filter(a=>a.examStatus==='มีสิทธิ์สอบ');c.innerHTML=`<h1 class="section-title">บัตรประจำตัวสอบ</h1>${apps.map(a=>`<div class="card" style="margin-bottom:12px"><h3>${esc(a.applicationNo)}</h3><p>ผู้สมัคร: ${esc(a.studentName||STATE.portal.student.firstName+' '+STATE.portal.student.lastName)}</p><p>เลขที่นั่งสอบ: <b>${esc(a.seatNo||'-')}</b> · ห้อง: <b>${esc(a.examRoom||'-')}</b> · อาคาร: ${esc(a.examBuilding||'-')}</p><p>วันสอบ: ${fmtDate(a.exam?.examDate)} เวลา ${esc(a.exam?.examTime||'-')}</p><button class="btn btn-primary" onclick="printExamTicket('${a.applicationId}')"><i class="fa-solid fa-print"></i> พิมพ์บัตรประจำตัวสอบ</button></div>`).join('')||'<div class="card empty">ยังไม่มีบัตรประจำตัวสอบ</div>'}`}
function printExamTicket(appId){const a=STATE.portal.applications.find(x=>x.applicationId===appId);const w=window.open('','_blank');w.document.write(`<html><head><meta charset="UTF-8"><style>body{font-family:'TH Sarabun New',Arial;font-size:20pt;padding:30px}h1,h2{text-align:center}.ticket{border:2px solid #17365d;padding:25px}.line{border-bottom:1px solid #999;padding:10px 0}</style></head><body><div class="ticket"><h1>${esc(STATE.portal.settings.schoolName||'')}</h1><h2>บัตรประจำตัวสอบ</h2><div class="line">เลขที่ใบสมัคร: ${esc(a.applicationNo)}</div><div class="line">ชื่อ-สกุล: ${esc(STATE.portal.student.firstName+' '+STATE.portal.student.lastName)}</div><div class="line">เลขที่นั่งสอบ: <b>${esc(a.seatNo||'-')}</b></div><div class="line">ห้องสอบ: ${esc(a.examRoom||'-')} · อาคาร: ${esc(a.examBuilding||'-')}</div><div class="line">วันสอบ: ${fmtDate(a.exam?.examDate)} เวลา: ${esc(a.exam?.examTime||'-')}</div></div><script>window.print()<\/script></body></html>`);w.document.close()}
function openStaffLogin(){modal('เข้าสู่ระบบเจ้าหน้าที่',`<form onsubmit="staffLogin(event)" class="form-card"><div class="field"><label class="required">ชื่อผู้ใช้</label><input id="staffUser" required autocomplete="username"></div><div class="field"><label class="required">รหัสผ่าน</label><input id="staffPass" type="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button></form>`)}
async function staffLogin(e){e.preventDefault();const r=await run('loginStaff',$('staffUser').value,$('staffPass').value);STATE.session=r;closeModal();renderStaffShell(r.user.type)}
async function renderStaffShell(role){const dash=await run('getStaffDashboard',STATE.session.token);STATE.staffDash=dash;$('topActions').innerHTML=`<button class="btn btn-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>`;const admin=role==='admin';$('app').innerHTML=`<div class="portal"><aside class="sidebar"><h3>${admin?'ผู้ดูแลระบบ':'เจ้าหน้าที่รับสมัคร'}</h3>${staffMenus(admin).map(m=>`<button class="nav-btn" onclick="staffPage('${m[0]}')"><i class="fa-solid ${m[1]}"></i>${m[2]}</button>`).join('')}<button class="nav-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button></aside><section class="content" id="staffContent"></section></div>`;staffPage('dashboard')}
function staffMenus(admin){const x=[['dashboard','fa-chart-column','แดชบอร์ด'],['applications','fa-file-lines','จัดการใบสมัคร'],['documents','fa-folder-check','ตรวจสอบเอกสาร'],['payments','fa-money-check-dollar','ตรวจสอบการชำระเงิน'],['exams','fa-chair','จัดการการสอบ'],['results','fa-square-poll-vertical','จัดการผลสอบ'],['reports','fa-file-export','ออกรายงาน']];if(admin)x.push(['rounds','fa-calendar-days','จัดการรอบรับสมัคร'],['programs','fa-layer-group','จัดการแผนการเรียน'],['users','fa-users-gear','จัดการผู้ใช้งาน'],['settings','fa-gear','ตั้งค่าระบบ']);return x}
function staffPage(p){if(p==='dashboard')return staffDashboard();if(p==='applications')return staffApplications();if(p==='documents')return staffDocuments();if(p==='payments')return staffPayments();if(p==='exams')return staffExams();if(p==='results')return staffResults();if(p==='reports')return staffReports();if(p==='rounds')return staffRounds();if(p==='programs')return staffPrograms();if(p==='users')return staffUsers();if(p==='settings')return staffSettings()}
function staffDashboard(){const d=STATE.staffDash;$('staffContent').innerHTML=`<h1 class="section-title">แดชบอร์ด</h1><div class="stat-grid"><div class="stat">ผู้สมัครทั้งหมด<div class="num">${d.stats.applications}</div></div><div class="stat">ยอดชำระที่อนุมัติ<div class="num">${Number(d.stats.paid).toLocaleString()} <small>บาท</small></div></div><div class="stat">ผ่านการคัดเลือก<div class="num">${d.stats.passed}</div></div><div class="stat">ตัวสำรอง<div class="num">${d.stats.reserve}</div></div></div><h2 class="section-title">รอบรับสมัคร</h2><div class="table-wrap"><table class="data-table"><tr><th>รอบ</th><th>ปี</th><th>ช่วงสมัคร</th><th>สอบ</th><th>สถานะ</th></tr>${d.rounds.map(r=>`<tr><td>${esc(r.roundName)}</td><td>${esc(r.academicYear)}</td><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td>${fmtDate(r.examDate)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีข้อมูล</td></tr>'}</table></div>`}
async function getApps(filters){return await run('listApplications',STATE.session.token,filters||{})}
async function staffApplications(){const apps=await getApps({});$('staffContent').innerHTML=`<h1 class="section-title">จัดการใบสมัคร</h1><div class="form-card"><div class="form-grid"><div class="field"><label>ค้นหา</label><input id="appSearch" oninput="filterAppTable()" placeholder="เลขที่ใบสมัคร / ชื่อ / บัตรประชาชน"></div><div class="field"><label>สถานะ</label><select id="appStatusFilter" onchange="staffApplications()"><option value="">ทั้งหมด</option><option>รอตรวจสอบ</option><option>รอตรวจสอบเอกสาร</option><option>เอกสารไม่สมบูรณ์</option><option>มีสิทธิ์เข้าสู่ขั้นตอนต่อไป</option><option>สอบผ่าน</option></select></div></div></div><div class="table-wrap" style="margin-top:12px"><table class="data-table" id="appTable"><tr><th>เลขที่</th><th>ผู้สมัคร</th><th>แผนการเรียน</th><th>เอกสาร</th><th>ชำระเงิน</th><th>ผล</th><th>จัดการ</th></tr>${apps.map(appRow).join('')||'<tr><td colspan="7" class="empty">ไม่พบข้อมูล</td></tr>'}</table></div>`}
function appRow(a){return `<tr data-search="${esc(a.applicationNo+' '+a.student.citizenId+' '+a.student.firstName+' '+a.student.lastName)}"><td>${esc(a.applicationNo)}</td><td>${esc(a.student.firstName+' '+a.student.lastName)}<br><small>${esc(a.student.citizenId)}</small></td><td>${esc(a.program.programName||'-')}</td><td>${statusBadge(a.documentStatus)}</td><td>${statusBadge(a.paymentStatus)}</td><td>${statusBadge(a.resultStatus)}</td><td><button class="btn btn-outline" onclick='viewApplication(${JSON.stringify(a).replace(/'/g,"&#39;")})'>ดู</button></td></tr>`}
function filterAppTable(){const q=($('appSearch').value||'').toLowerCase();document.querySelectorAll('#appTable tr[data-search]').forEach(r=>r.style.display=r.dataset.search.toLowerCase().includes(q)?'':'none')}
function viewApplication(a){modal('รายละเอียดใบสมัคร',`<div class="grid-2"><div><b>เลขที่ใบสมัคร</b><br>${esc(a.applicationNo)}</div><div><b>ชื่อ-สกุล</b><br>${esc(a.student.firstName+' '+a.student.lastName)}</div><div><b>เลขบัตรประชาชน</b><br>${esc(a.student.citizenId)}</div><div><b>โทรศัพท์</b><br>${esc(a.student.phone)}</div><div><b>โรงเรียนเดิม</b><br>${esc(a.student.previousSchool)}</div><div><b>GPA</b><br>${esc(a.student.gpa||'-')}</div></div><h3 class="section-title">สถานะ</h3><p>ใบสมัคร ${statusBadge(a.applicationStatus)} · เอกสาร ${statusBadge(a.documentStatus)} · ชำระเงิน ${statusBadge(a.paymentStatus)}</p><h3 class="section-title">เอกสาร</h3><div class="file-list">${(a.documents||[]).map(d=>`<div class="file-row"><div><b>${esc(d.documentType)}</b><br>${statusBadge(d.verificationStatus)}<br>${esc(d.verificationNote||'')}</div><div><button class="btn btn-light" onclick="openFile('${d.fileId}')">เปิด</button><button class="btn btn-success" onclick="verifyDoc('${d.documentId}','อนุมัติ')">อนุมัติ</button><button class="btn btn-danger" onclick="rejectDoc('${d.documentId}')">ปฏิเสธ</button></div></div>`).join('')}</div>`)}
async function openFile(id){const r=await run('getFileData',STATE.session.token,id);const a=document.createElement('a');a.href='data:'+r.mimeType+';base64,'+r.data;a.target='_blank';a.download=r.name;a.click()}
async function verifyDoc(id,status,note=''){await run('verifyDocument',STATE.session.token,id,status,note);closeModal();Swal.fire({icon:'success',title:'บันทึกสถานะแล้ว'});staffApplications()}
function rejectDoc(id){Swal.fire({title:'หมายเหตุที่ต้องแก้ไข',input:'textarea',inputPlaceholder:'ระบุเหตุผลหรือรายการที่ต้องแก้ไข',showCancelButton:true,confirmButtonText:'บันทึก'}).then(r=>{if(r.isConfirmed)verifyDoc(id,'ปฏิเสธ',r.value)})}
async function staffDocuments(){const apps=await getApps({});const pending=apps.flatMap(a=>(a.documents||[]).filter(d=>d.verificationStatus==='รอตรวจสอบ').map(d=>Object.assign(d,{application:a})));$('staffContent').innerHTML=`<h1 class="section-title">ตรวจสอบเอกสาร</h1><div class="table-wrap"><table class="data-table"><tr><th>ใบสมัคร</th><th>ผู้สมัคร</th><th>เอกสาร</th><th>ไฟล์</th><th>ดำเนินการ</th></tr>${pending.map(d=>`<tr><td>${esc(d.application.applicationNo)}</td><td>${esc(d.application.student.firstName+' '+d.application.student.lastName)}</td><td>${esc(d.documentType)}</td><td><button class="btn btn-light" onclick="openFile('${d.fileId}')">เปิดไฟล์</button></td><td><button class="btn btn-success" onclick="verifyDoc('${d.documentId}','อนุมัติ')">อนุมัติ</button> <button class="btn btn-danger" onclick="rejectDoc('${d.documentId}')">ปฏิเสธ</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">ไม่มีเอกสารรอตรวจสอบ</td></tr>'}</table></div>`}
async function staffPayments(){const apps=await getApps({});const rows=apps.filter(a=>a.payment&&a.payment.verificationStatus==='รอตรวจสอบ');$('staffContent').innerHTML=`<h1 class="section-title">ตรวจสอบการชำระเงิน</h1><div class="table-wrap"><table class="data-table"><tr><th>ใบสมัคร</th><th>ผู้สมัคร</th><th>ยอดเงิน</th><th>เลขอ้างอิง</th><th>วันที่โอน</th><th>สลิป</th><th>ดำเนินการ</th></tr>${rows.map(a=>`<tr><td>${esc(a.applicationNo)}</td><td>${esc(a.student.firstName+' '+a.student.lastName)}</td><td>${Number(a.payment.amount||0).toLocaleString()}</td><td>${esc(a.payment.referenceNo||'-')}</td><td>${fmtDate(a.payment.bankDate)}</td><td><button class="btn btn-light" onclick="openFile('${a.payment.slipFileId}')">เปิด</button></td><td><button class="btn btn-success" onclick="verifyPay('${a.payment.paymentId}','อนุมัติ')">อนุมัติ</button> <button class="btn btn-danger" onclick="verifyPay('${a.payment.paymentId}','ปฏิเสธ')">ปฏิเสธ</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">ไม่มีรายการรอตรวจสอบ</td></tr>'}</table></div><div class="card" style="margin-top:15px"><h3>นำเข้าข้อมูลธนาคาร CSV</h3><p class="help">ไฟล์ CSV ควรมี applicationId, amount, referenceNo, bankDate, bankTime ตามลำดับที่ต้องการประมวลผล</p><input type="file" id="bankCsv" accept=".csv"><button class="btn btn-primary" style="margin-top:8px" onclick="importBankCsv()">นำเข้า</button></div>`}
async function verifyPay(id,status){let note='';if(status==='ปฏิเสธ'){const r=await Swal.fire({title:'หมายเหตุ',input:'textarea',showCancelButton:true,confirmButtonText:'บันทึก'});if(!r.isConfirmed)return;note=r.value}await run('verifyPayment',STATE.session.token,id,status,note);Swal.fire({icon:'success',title:'บันทึกสถานะแล้ว'});staffPayments()}
async function importBankCsv(){const f=$('bankCsv').files[0];if(!f)return;const text=await f.text();Swal.fire({icon:'info',title:'รับไฟล์แล้ว',text:'ฟังก์ชันนำเข้าโครงสร้างธนาคารให้กำหนด mapping กับระบบจริงก่อนใช้งาน'});}
async function staffExams(){const rounds=await run('listRounds',STATE.session.token);$('staffContent').innerHTML=`<h1 class="section-title">จัดการการสอบ</h1><div class="form-card"><div class="field"><label>รอบรับสมัคร</label><select id="examRound">${rounds.map(r=>`<option value="${r.roundId}">${esc(r.roundName)} · ${esc(r.academicYear)}</option>`).join('')}</select></div><div class="actions"><button class="btn btn-primary" onclick="assignSeats()"><i class="fa-solid fa-chair"></i> จัดห้องและเลขที่นั่งสอบอัตโนมัติ</button></div></div><div class="form-card" style="margin-top:12px"><h3>นำเข้าคะแนนสอบจาก CSV</h3><input type="file" id="scoreCsv" accept=".csv"><div class="actions"><button class="btn btn-outline" onclick="importScoreFile()">นำเข้าคะแนน</button></div><p class="help">หัวตาราง: applicationId, subject, score</p></div>`}
async function assignSeats(){await run('assignExamSeats',STATE.session.token,$('examRound').value);Swal.fire({icon:'success',title:'จัดเลขที่นั่งสอบแล้ว'});staffExams()}
async function importScoreFile(){const f=$('scoreCsv').files[0];if(!f)return;const t=await f.text();await run('importScores',STATE.session.token,$('examRound').value,t);Swal.fire({icon:'success',title:'นำเข้าคะแนนแล้ว'})}
async function staffResults(){const rounds=await run('listRounds',STATE.session.token);$('staffContent').innerHTML=`<h1 class="section-title">จัดการผลสอบและประกาศผล</h1><div class="form-card"><div class="field"><label>รอบรับสมัคร</label><select id="resultRound" onchange="loadResultApps()">${rounds.map(r=>`<option value="${r.roundId}">${esc(r.roundName)} · ${esc(r.academicYear)}</option>`).join('')}</select></div><div id="resultList" style="margin-top:12px"></div></div>`;loadResultApps()}
async function loadResultApps(){const apps=await getApps({roundId:$('resultRound').value});$('resultList').innerHTML=`<div class="table-wrap"><table class="data-table"><tr><th>ใบสมัคร</th><th>ชื่อ</th><th>แผน</th><th>ผล</th></tr>${apps.map(a=>`<tr><td>${esc(a.applicationNo)}<input type="hidden" class="res-id" value="${a.applicationId}"></td><td>${esc(a.student.firstName+' '+a.student.lastName)}</td><td>${esc(a.program.programName||'')}</td><td><select class="res-status"><option value="">ยังไม่ระบุ</option><option ${a.resultStatus==='ผ่านการคัดเลือก'?'selected':''}>ผ่านการคัดเลือก</option><option ${a.resultStatus==='ตัวสำรอง'?'selected':''}>ตัวสำรอง</option><option ${a.resultStatus==='ไม่ผ่านการคัดเลือก'?'selected':''}>ไม่ผ่านการคัดเลือก</option></select></td></tr>`).join('')||'<tr><td colspan="4" class="empty">ไม่พบผู้สมัคร</td></tr>'}</table></div><div class="actions"><button class="btn btn-primary" onclick="publishResults()">เผยแพร่ผลการคัดเลือก</button></div>`}
async function publishResults(){const ids=[...document.querySelectorAll('.res-id')],sts=[...document.querySelectorAll('.res-status')];const items=ids.map((x,i)=>({applicationId:x.value,resultStatus:sts[i].value})).filter(x=>x.resultStatus);await run('publishResults',STATE.session.token,$('resultRound').value,items);Swal.fire({icon:'success',title:'เผยแพร่ผลแล้ว'});loadResultApps()}
async function staffReports(){$('staffContent').innerHTML=`<h1 class="section-title">ออกรายงาน</h1><div class="grid"><div class="card"><h3>ข้อมูลผู้สมัครทั้งหมด</h3><button class="btn btn-primary" onclick="exportXlsx()">Excel</button> <button class="btn btn-outline" onclick="exportCsv()">CSV</button></div><div class="card"><h3>รายชื่อผู้มีสิทธิ์สอบ</h3><button class="btn btn-primary" onclick="exportPdf('exam')">PDF</button></div><div class="card"><h3>ผู้ผ่านการคัดเลือก</h3><button class="btn btn-primary" onclick="exportPdf('passed')">PDF</button></div><div class="card"><h3>ตัวสำรอง</h3><button class="btn btn-primary" onclick="exportPdf('reserve')">PDF</button></div><div class="card"><h3>รายงานผู้สมัครทั้งหมด</h3><button class="btn btn-outline" onclick="exportPdf('all')">PDF</button></div></div>`}
async function exportCsv(){const r=await run('exportApplicationsCsv',STATE.session.token,{});downloadData(r)}
async function exportXlsx(){const r=await run('exportApplicationsXlsx',STATE.session.token,{});downloadData(r)}
async function exportPdf(type){const r=await run('exportPdf',STATE.session.token,type,{});downloadData(r)}
function downloadData(r){const a=document.createElement('a');a.href='data:'+r.mimeType+';base64,'+r.data;a.download=r.name;a.click()}
async function staffRounds(){const rounds=await run('listRounds',STATE.session.token);$('staffContent').innerHTML=`<h1 class="section-title">จัดการรอบรับสมัคร</h1><div class="form-card"><h3>เพิ่มรอบรับสมัคร</h3><form onsubmit="createRound(event)"><div class="form-grid"><div class="field"><label class="required">ปีการศึกษา</label><input id="rYear" required placeholder="เช่น 2569"></div><div class="field"><label class="required">ชื่อรอบ</label><input id="rName" required placeholder="เช่น รอบทั่วไป"></div><div class="field"><label class="required">วันเปิดรับสมัคร</label><input id="rStart" type="datetime-local" required></div><div class="field"><label class="required">วันปิดรับสมัคร</label><input id="rEnd" type="datetime-local" required></div><div class="field"><label>วันสอบ</label><input id="rExam" type="datetime-local"></div><div class="field"><label>วันประกาศผล</label><input id="rResult" type="datetime-local"></div><div class="field"><label>วันเริ่มยืนยันสิทธิ์</label><input id="rConfirmStart" type="datetime-local"></div><div class="field"><label>วันสิ้นสุดยืนยันสิทธิ์</label><input id="rConfirmEnd" type="datetime-local"></div><div class="field"><label>ค่าธรรมเนียม</label><input id="rFee" type="number" min="0" value="0"></div><div class="field"><label>สถานะ</label><select id="rStatus"><option value="OPEN">เปิดรับสมัคร</option><option value="CLOSED">ปิด</option></select></div><div class="field full"><label>รายละเอียด / ระเบียบการ</label><textarea id="rDesc"></textarea></div></div><button class="btn btn-primary" type="submit">บันทึกรอบรับสมัคร</button></form></div><h2 class="section-title">รอบที่มีอยู่</h2><div class="table-wrap"><table class="data-table"><tr><th>รอบ</th><th>ปี</th><th>วันสมัคร</th><th>สอบ</th><th>ค่าธรรมเนียม</th><th>สถานะ</th><th>จัดการ</th></tr>${rounds.map(r=>`<tr><td>${esc(r.roundName)}</td><td>${esc(r.academicYear)}</td><td>${fmtDate(r.startDate)} - ${fmtDate(r.endDate)}</td><td>${fmtDate(r.examDate)}</td><td>${Number(r.applicationFee||0).toLocaleString()}</td><td>${statusBadge(r.status)}</td><td><button class="btn btn-outline" onclick="toggleRound('${r.roundId}','${r.status==='OPEN'?'CLOSED':'OPEN'}')">${r.status==='OPEN'?'ปิด':'เปิด'}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีรอบรับสมัคร</td></tr>'}</table></div>`}
async function createRound(e){e.preventDefault();const d={academicYear:$('rYear').value,roundName:$('rName').value,startDate:$('rStart').value,endDate:$('rEnd').value,examDate:$('rExam').value,resultDate:$('rResult').value,confirmStartDate:$('rConfirmStart').value,confirmEndDate:$('rConfirmEnd').value,applicationFee:$('rFee').value,status:$('rStatus').value,description:$('rDesc').value};await run('createRound',STATE.session.token,d);Swal.fire({icon:'success',title:'เพิ่มรอบรับสมัครสำเร็จ'});staffRounds()}
async function toggleRound(id,status){await run('updateRound',STATE.session.token,id,{status});Swal.fire({icon:'success',title:'บันทึกสถานะแล้ว'});staffRounds()}
async function staffPrograms(){const [rounds,programs]=await Promise.all([run('listRounds',STATE.session.token),run('listPrograms',STATE.session.token)]);$('staffContent').innerHTML=`<h1 class="section-title">จัดการแผนการเรียน / โควตา</h1><div class="form-card"><form onsubmit="createProgram(event)"><div class="form-grid"><div class="field"><label class="required">รอบรับสมัคร</label><select id="pRound" required>${rounds.map(r=>`<option value="${r.roundId}">${esc(r.roundName)} · ${esc(r.academicYear)}</option>`).join('')}</select></div><div class="field"><label class="required">ชื่อแผนการเรียน</label><input id="pName" required></div><div class="field"><label>ประเภท</label><input id="pType"></div><div class="field"><label>ชื่อโควตา</label><input id="pQuota"></div><div class="field"><label class="required">จำนวนรับ</label><input id="pCap" type="number" min="1" required></div><div class="field"><label>GPA ขั้นต่ำ</label><input id="pGpa" type="number" min="0" max="4" step="0.01"></div><div class="field full"><label>รายละเอียด</label><textarea id="pDesc"></textarea></div></div><button class="btn btn-primary" type="submit">เพิ่มแผนการเรียน</button></form></div><h2 class="section-title">รายการแผนการเรียน</h2><div class="table-wrap"><table class="data-table"><tr><th>แผน</th><th>รอบ</th><th>โควตา</th><th>รับ</th><th>ใช้ไป</th><th>สถานะ</th></tr>${programs.map(p=>`<tr><td>${esc(p.programName)}</td><td>${esc(rounds.find(r=>String(r.roundId)===String(p.roundId))?.roundName||p.roundId)}</td><td>${esc(p.quotaName||'-')}</td><td>${p.capacity}</td><td>${p.usedCapacity}</td><td>${statusBadge(p.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr>'}</table></div>`}
async function createProgram(e){e.preventDefault();await run('createProgram',STATE.session.token,{roundId:$('pRound').value,programName:$('pName').value,programType:$('pType').value,quotaName:$('pQuota').value,capacity:$('pCap').value,minimumGpa:$('pGpa').value,description:$('pDesc').value});Swal.fire({icon:'success',title:'เพิ่มแผนการเรียนสำเร็จ'});staffPrograms()}
async function staffUsers(){const users=await run('listUsers',STATE.session.token);$('staffContent').innerHTML=`<h1 class="section-title">จัดการผู้ใช้งาน</h1><div class="form-card"><form onsubmit="createUser(event)"><div class="form-grid"><div class="field"><label class="required">ชื่อผู้ใช้</label><input id="uUser" required></div><div class="field"><label class="required">รหัสผ่าน</label><input id="uPass" type="password" required></div><div class="field"><label class="required">ชื่อ-สกุล</label><input id="uName" required></div><div class="field"><label class="required">สิทธิ์</label><select id="uRole"><option value="staff">เจ้าหน้าที่</option><option value="admin">ผู้ดูแลระบบ</option></select></div></div><button class="btn btn-primary">เพิ่มผู้ใช้งาน</button></form></div><div class="table-wrap" style="margin-top:12px"><table class="data-table"><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>สถานะ</th></tr>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.fullName)}</td><td>${esc(u.role)}</td><td>${u.active?'ใช้งาน':'ระงับ'}</td></tr>`).join('')}</table></div>`}
async function createUser(e){e.preventDefault();await run('createUser',STATE.session.token,{username:$('uUser').value,password:$('uPass').value,fullName:$('uName').value,role:$('uRole').value});Swal.fire({icon:'success',title:'เพิ่มผู้ใช้งานแล้ว'});staffUsers()}
async function staffSettings(){const s=STATE.public?.settings||await run('getPublicData').then(x=>x.settings);$('staffContent').innerHTML=`<h1 class="section-title">ตั้งค่าระบบ</h1><div class="form-card"><form onsubmit="saveSystemSettings(event)"><div class="form-grid"><div class="field full"><label>ชื่อโรงเรียน</label><input id="sSchool" value="${esc(s.schoolName||'')}"></div><div class="field"><label>เบอร์โทรศัพท์</label><input id="sPhone" value="${esc(s.contactPhone||'')}"></div><div class="field"><label>อีเมล</label><input id="sEmail" value="${esc(s.contactEmail||'')}"></div><div class="field full"><label>ที่อยู่</label><textarea id="sAddress">${esc(s.address||'')}</textarea></div><div class="field full"><label>หัวข้อหน้าแรก</label><input id="sOpen" value="${esc(s.systemOpenMessage||'')}"></div><div class="field full"><label>ประกาศหน้าแรก</label><textarea id="sNotice">${esc(s.homeNotice||'')}</textarea></div><div class="field full"><label>ข้อความ PDPA</label><textarea id="sPdpa">${esc(s.pdpaText||'')}</textarea></div><div class="field"><label>โลโก้โรงเรียน</label><input id="sLogo" type="file" accept=".jpg,.jpeg,.png,.webp"></div><div class="field"><label>แบนเนอร์หน้าแรก</label><input id="sBanner" type="file" accept=".jpg,.jpeg,.png,.webp"></div></div><button class="btn btn-primary" type="submit">บันทึกการตั้งค่า</button></form></div><p class="help">ไฟล์รูปต้องเลือกจากเครื่องเท่านั้น ระบบนี้ไม่รับ URL รูปภาพ</p>`}
async function saveSystemSettings(e){e.preventDefault();const d={schoolName:$('sSchool').value,contactPhone:$('sPhone').value,contactEmail:$('sEmail').value,address:$('sAddress').value,systemOpenMessage:$('sOpen').value,homeNotice:$('sNotice').value,pdpaText:$('sPdpa').value};for(const [input,kind] of [['sLogo','logo'],['sBanner','banner']]){const f=$(input).files[0];if(f){const base=await fileToBase64(f);await run('uploadSystemFile',STATE.session.token,{fileName:f.name,mimeType:f.type,base64:base},kind)}}await run('saveSettings',d,STATE.session.token);Swal.fire({icon:'success',title:'บันทึกการตั้งค่าแล้ว'});STATE.public=await run('getPublicData');applyBrand(STATE.public.settings);staffSettings()}
init();
</script>
