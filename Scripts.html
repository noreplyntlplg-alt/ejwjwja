
<script>
const state = {
  publicData:null, mode:'public', studentToken:null, staffToken:null,
  student:null, staff:null, dashboard:null, currentApplication:null,
  staffSection:'dashboard', charts:{}, rounds:[], programs:[], selectedRoundId:''
};

document.addEventListener('DOMContentLoaded', init);

function init(){
  loadPublic();
}

function api(fn,args=[]){
  showLoading();
  return new Promise((resolve,reject)=>{
    google.script.run
      .withSuccessHandler(r=>{hideLoading();resolve(r);})
      .withFailureHandler(e=>{hideLoading();showError(e);reject(e);})[fn](...args);
  });
}
function showLoading(t='กำลังดำเนินการ...'){document.getElementById('loadingText').textContent=t;document.getElementById('loading').classList.remove('hidden')}
function hideLoading(){document.getElementById('loading').classList.add('hidden')}
function showError(e){Swal.fire({icon:'error',title:'ไม่สามารถดำเนินการได้',text:e&&e.message?e.message:String(e),confirmButtonText:'ตกลง'})}
function ok(title,text=''){return Swal.fire({icon:'success',title:title,text:text,confirmButtonText:'ตกลง'})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(n){return Number(n||0).toLocaleString('th-TH')}
function badge(s){
  const x=String(s||'');
  let c='badge';
  if(['ผ่านการคัดเลือก','สอบผ่าน','ยืนยันสิทธิ์','อนุมัติ','APPROVED','VERIFIED'].includes(x)) c+=' badge-success';
  else if(['เอกสารไม่สมบูรณ์','ไม่ผ่านการคัดเลือก','ปฏิเสธ','REJECTED'].includes(x)) c+=' badge-danger';
  else if(['รอตรวจสอบ','PENDING','รอ'].includes(x)) c+=' badge-warning';
  else c+=' badge-blue';
  return `<span class="${c}">${esc(x)}</span>`;
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve({name:file.name,mimeType:file.type,data:r.result});
    r.onerror=reject;r.readAsDataURL(file);
  });
}
function downloadDataUrl(dataUrl,fileName){
  const a=document.createElement('a');a.href=dataUrl;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
}
function setBrand(){
  if(!state.publicData)return;
  const s=state.publicData.settings||{};
  document.getElementById('brandName').textContent=s.schoolName||'ระบบรับสมัครนักเรียน';
  document.getElementById('footerName').textContent=s.schoolName||'ระบบรับสมัครนักเรียน';
  if(s.schoolLogoUrl) document.getElementById('brandLogo').innerHTML=`<img src="${esc(s.schoolLogoUrl)}" alt="โลโก้โรงเรียน">`;
}
async function loadPublic(){
  try{
    state.publicData=await api('getPublicBootstrap');
    setBrand();renderHome();
  }catch(e){}
}
function showHome(){state.mode='public';renderHome()}
function renderHome(){
  const d=state.publicData||{settings:{},rounds:[]},s=d.settings||{};
  document.getElementById('app').innerHTML=`
    <section class="hero" ${s.bannerUrl?`style="background-image:linear-gradient(135deg,rgba(15,44,89,.95),rgba(36,79,135,.86)),url('${esc(s.bannerUrl)}');background-size:cover;background-position:center"`:''}>
      <h1>${esc(s.homeTitle||s.schoolName||'ระบบรับสมัครนักเรียน')}</h1>
      <p>${esc(s.homeSubtitle||'ระบบรับสมัครนักเรียนออนไลน์')}</p>
      <div class="actions" style="margin-top:15px">
        <button class="btn btn-gold" onclick="showRegister()"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิก</button>
        <button class="btn btn-outline" onclick="showLoginChoice()"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>
      </div>
    </section>
    <div class="grid grid-2">
      <section class="card">
        <div class="card-title"><i class="fa-solid fa-bullhorn"></i> ประกาศและคำแนะนำ</div>
        <div class="notice">${esc(s.homeNotice||'กรุณาตรวจสอบรอบรับสมัครและเตรียมเอกสารให้ครบถ้วนก่อนสมัคร')}</div>
        <div class="notice"><strong>การคุ้มครองข้อมูลส่วนบุคคล</strong><br>${esc(s.pdpaText||'')}</div>
      </section>
      <section class="card">
        <div class="card-title"><i class="fa-solid fa-calendar-days"></i> รอบรับสมัครที่เปิดอยู่</div>
        ${renderOpenRounds(d.rounds)}
      </section>
    </div>`;
  document.getElementById('topActions').innerHTML=`<button class="btn btn-outline" onclick="showLoginChoice()"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button>`;
}
function renderOpenRounds(rounds){
  if(!rounds||!rounds.length)return `<div class="empty">ขณะนี้ยังไม่มีรอบรับสมัครที่เปิดอยู่</div>`;
  return rounds.map(r=>`
    <div class="card" style="margin-bottom:9px;padding:12px">
      <div style="font-weight:700;color:var(--navy);font-size:21px">${esc(r.roundName)}</div>
      <div>ปีการศึกษา ${esc(r.academicYear)} | ${esc(r.roundType)}</div>
      <div class="help">เปิด ${esc(r.openDate)} ถึง ${esc(r.closeDate)} | ค่าธรรมเนียม ${fmt(r.fee)} บาท</div>
      <div class="actions" style="margin-top:7px"><button class="btn btn-primary btn-sm" onclick="showRegister('${esc(r.roundId)}')">สมัครรอบนี้</button></div>
    </div>`).join('');
}

function showLoginChoice(){
  Swal.fire({
    title:'เข้าสู่ระบบ',
    html:`<div class="actions" style="justify-content:center">
      <button id="swStudent" class="btn btn-primary"><i class="fa-solid fa-user-graduate"></i> ผู้สมัครเรียน</button>
      <button id="swStaff" class="btn btn-light"><i class="fa-solid fa-user-tie"></i> เจ้าหน้าที่</button></div>`,
    showConfirmButton:false,showCloseButton:true
  });
  setTimeout(()=>{document.getElementById('swStudent').onclick=()=>{Swal.close();showStudentLogin()};document.getElementById('swStaff').onclick=()=>{Swal.close();showStaffLogin()}},50);
}
function showStudentLogin(){
  document.getElementById('app').innerHTML=`
  <div class="card" style="max-width:520px;margin:25px auto">
    <div class="card-title"><i class="fa-solid fa-user-graduate"></i> เข้าสู่ระบบผู้สมัคร</div>
    <div class="help">ใช้หมายเลขบัตรประจำตัวประชาชน 13 หลักของผู้สมัครที่ลงทะเบียนไว้แล้ว</div>
    <div class="form-group" style="margin-top:12px"><label>หมายเลขบัตรประจำตัวประชาชน <span class="required">*</span></label><input id="studentCitizen" inputmode="numeric" maxlength="13" placeholder="กรอกเลข 13 หลัก"></div>
    <div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="studentLogin()"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ</button><button class="btn btn-light" onclick="showRegister()">สมัครสมาชิก</button></div>
  </div>`;
}
async function studentLogin(){
  const id=document.getElementById('studentCitizen').value.trim();
  try{const r=await api('loginStudent',[id]);state.studentToken=r.token;state.student=r.student;state.dashboard=r.dashboard;state.mode='student';renderStudent();}
  catch(e){}
}
function showStaffLogin(){
  document.getElementById('app').innerHTML=`
  <div class="card" style="max-width:520px;margin:25px auto">
    <div class="card-title"><i class="fa-solid fa-user-shield"></i> เข้าสู่ระบบเจ้าหน้าที่</div>
    <div class="form-group"><label>ชื่อผู้ใช้</label><input id="staffUser" autocomplete="username"></div>
    <div class="form-group"><label>รหัสผ่าน</label><input id="staffPass" type="password" autocomplete="current-password"></div>
    <div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="staffLogin()">เข้าสู่ระบบ</button><button class="btn btn-light" onclick="showHome()">กลับหน้าหลัก</button></div>
  </div>`;
}
async function staffLogin(){
  try{const r=await api('loginStaff',[document.getElementById('staffUser').value,document.getElementById('staffPass').value]);state.staffToken=r.token;state.staff=r.user;state.mode='staff';await loadStaffData();renderStaff();}
  catch(e){}
}
async function showRegister(roundId=''){
  state.publicData=state.publicData||await api('getPublicBootstrap');
  const rounds=state.publicData.rounds||[];
  document.getElementById('app').innerHTML=`
  <div class="card" style="max-width:760px;margin:15px auto">
    <div class="card-title"><i class="fa-solid fa-user-plus"></i> สมัครสมาชิกผู้สมัคร</div>
    <div class="notice">ผู้สมัครต้องสมัครสมาชิกก่อน จึงจะเข้าสู่ระบบและกรอกใบสมัครได้</div>
    <div class="form-grid">
      <div class="form-group"><label>คำนำหน้า</label><select id="regPrefix"><option value="">เลือก</option><option>เด็กชาย</option><option>เด็กหญิง</option><option>นาย</option><option>นางสาว</option></select></div>
      <div class="form-group"><label>เลขบัตรประชาชน <span class="required">*</span></label><input id="regCitizen" maxlength="13" inputmode="numeric"></div>
      <div class="form-group"><label>ชื่อ <span class="required">*</span></label><input id="regFirst"></div>
      <div class="form-group"><label>นามสกุล <span class="required">*</span></label><input id="regLast"></div>
      <div class="form-group"><label>วันเกิด</label><input id="regBirth" type="date"></div>
      <div class="form-group"><label>โทรศัพท์ <span class="required">*</span></label><input id="regPhone" inputmode="tel"></div>
      <div class="form-group full"><label>อีเมล</label><input id="regEmail" type="email"></div>
      <div class="form-group full"><label class="file-box"><input id="regPDPA" type="checkbox"> ข้าพเจ้าอ่านและยินยอมให้โรงเรียนจัดเก็บและประมวลผลข้อมูลส่วนบุคคลตามประกาศ PDPA <span class="required">*</span></label></div>
    </div>
    <div class="actions" style="margin-top:12px"><button class="btn btn-primary" onclick="registerNow()"><i class="fa-solid fa-check"></i> สมัครสมาชิก</button><button class="btn btn-light" onclick="showHome()">ยกเลิก</button></div>
    <div class="help" style="margin-top:10px">หากเคยสมัครแล้ว ให้เข้าสู่ระบบด้วยเลขบัตรประชาชน ไม่ต้องสมัครซ้ำ</div>
  </div>`;
  if(roundId) setTimeout(()=>{},50);
}
async function registerNow(){
  const data={citizenId:document.getElementById('regCitizen').value,prefix:document.getElementById('regPrefix').value,
    firstName:document.getElementById('regFirst').value,lastName:document.getElementById('regLast').value,
    birthDate:document.getElementById('regBirth').value,phone:document.getElementById('regPhone').value,
    email:document.getElementById('regEmail').value,pdpaConsent:document.getElementById('regPDPA').checked?'true':'false'};
  try{await api('registerStudent',[data]);await ok('สมัครสมาชิกสำเร็จ','กรุณาเข้าสู่ระบบด้วยเลขบัตรประชาชน');showStudentLogin();}catch(e){}
}

/* ================= STUDENT ================= */
function studentNav(active){
  return `<aside class="sidebar">
    <button class="nav-btn ${active==='dashboard'?'active':''}" onclick="studentSection('dashboard')"><i class="fa-solid fa-gauge"></i> ภาพรวม</button>
    <button class="nav-btn ${active==='apply'?'active':''}" onclick="studentSection('apply')"><i class="fa-solid fa-file-pen"></i> กรอกใบสมัคร</button>
    <button class="nav-btn ${active==='documents'?'active':''}" onclick="studentSection('documents')"><i class="fa-solid fa-folder-open"></i> เอกสาร</button>
    <button class="nav-btn ${active==='payment'?'active':''}" onclick="studentSection('payment')"><i class="fa-solid fa-money-check-dollar"></i> ชำระค่าธรรมเนียม</button>
    <button class="nav-btn ${active==='status'?'active':''}" onclick="studentSection('status')"><i class="fa-solid fa-list-check"></i> ตรวจสอบสถานะ</button>
    <button class="nav-btn ${active==='exam'?'active':''}" onclick="studentSection('exam')"><i class="fa-solid fa-id-card"></i> บัตรประจำตัวสอบ</button>
    <button class="nav-btn" onclick="studentLogout()"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button>
  </aside>`;
}
function renderStudent(){
  document.getElementById('topActions').innerHTML=`<span class="badge badge-blue">${esc(state.student?.firstName||'ผู้สมัคร')}</span><button class="btn btn-outline btn-sm" onclick="studentLogout()">ออกจากระบบ</button>`;
  studentSection('dashboard');
}
async function refreshStudent(){
  const r=await api('getStudentDashboard',[state.studentToken]);state.student=r.student;state.dashboard=r.dashboard;
}
async function studentSection(sec){
  try{await refreshStudent();}catch(e){return}
  const body=document.getElementById('app');
  let content='';
  if(sec==='dashboard')content=studentDashboardHTML();
  if(sec==='apply')content=studentApplyHTML();
  if(sec==='documents')content=studentDocumentsHTML();
  if(sec==='payment')content=studentPaymentHTML();
  if(sec==='status')content=studentStatusHTML();
  if(sec==='exam')content=studentExamHTML();
  body.innerHTML=`<div class="sidebar-layout">${studentNav(sec)}<section class="dashboard-content">${content}</section></div>`;
  if(sec==='apply')populateApplyRound();
}
function studentDashboardHTML(){
  const apps=state.dashboard||[];
  return `<div class="card-title">ภาพรวมผู้สมัคร</div>
  <div class="grid grid-3">
    <div class="card stat"><div class="label">ชื่อผู้สมัคร</div><div class="value" style="font-size:24px">${esc(state.student?.firstName)} ${esc(state.student?.lastName)}</div></div>
    <div class="card stat"><div class="label">จำนวนใบสมัคร</div><div class="value">${apps.length}</div></div>
    <div class="card stat"><div class="label">เลขบัตรประชาชน</div><div class="value" style="font-size:20px">${esc(state.student?.citizenId)}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-title"><i class="fa-solid fa-file-circle-check"></i> ใบสมัครของฉัน</div>
    ${apps.length?apps.map(x=>studentAppCard(x)).join(''):'<div class="empty">ยังไม่มีใบสมัคร กรุณาเลือกเมนูกรอกใบสมัคร</div>'}</div>`;
}
function studentAppCard(x){
  const a=x.application,r=x.round,p=x.program;
  return `<div class="card" style="margin-bottom:10px">
    <div class="grid grid-2">
      <div><strong>เลขที่สมัคร:</strong> ${esc(a.applicationNo)}<br><strong>รอบ:</strong> ${esc(r.roundName||'')}<br><strong>แผนการเรียน:</strong> ${esc(p.programName||'')}</div>
      <div><strong>สถานะ:</strong> ${badge(a.status)}<br><strong>เอกสาร:</strong> ${x.documents?.length||0} รายการ<br><strong>ชำระเงิน:</strong> ${x.payment?badge(x.payment.status):badge('ยังไม่มีรายการ')}</div>
    </div>
  </div>`;
}
function studentApplyHTML(){
  const existing=state.dashboard||[];
  if(existing.length)return `<div class="card"><div class="card-title">กรอกใบสมัคร</div><div class="notice">คุณมีใบสมัครแล้ว หากต้องการติดตามเอกสารหรือผลการสมัคร ให้ใช้เมนูด้านซ้าย</div>${existing.map(studentAppCard).join('')}</div>`;
  return `<div class="card">
    <div class="card-title"><i class="fa-solid fa-file-pen"></i> ใบสมัครนักเรียน</div>
    <div class="stepper"><span class="step active">1 รอบ/แผน</span><span class="step">2 ข้อมูลส่วนตัว</span><span class="step">3 ครอบครัว</span><span class="step">4 การศึกษา</span><span class="step">5 ที่อยู่/เพิ่มเติม</span></div>
    <div class="form-grid">
      <div class="form-group full"><label>รอบรับสมัคร <span class="required">*</span></label><select id="appRound" onchange="populateApplyPrograms()"><option value="">เลือก</option></select></div>
      <div class="form-group full"><label>แผนการเรียน / โควตา <span class="required">*</span></label><select id="appProgram"><option value="">เลือกรอบก่อน</option></select></div>
      <div class="form-group"><label>คำนำหน้า</label><select id="aPrefix"><option value="">เลือก</option><option>เด็กชาย</option><option>เด็กหญิง</option><option>นาย</option><option>นางสาว</option></select></div>
      <div class="form-group"><label>ชื่อ <span class="required">*</span></label><input id="aFirst" value="${esc(state.student?.firstName||'')}"></div>
      <div class="form-group"><label>นามสกุล <span class="required">*</span></label><input id="aLast" value="${esc(state.student?.lastName||'')}"></div>
      <div class="form-group"><label>ชื่อเล่น</label><input id="aNick"></div>
      <div class="form-group"><label>วันเกิด <span class="required">*</span></label><input id="aBirth" type="date" value="${esc(state.student?.birthDate||'')}"></div>
      <div class="form-group"><label>สัญชาติ</label><input id="aNationality" value="ไทย"></div>
      <div class="form-group"><label>ศาสนา</label><input id="aReligion"></div>
      <div class="form-group"><label>โทรศัพท์ <span class="required">*</span></label><input id="aPhone" value="${esc(state.student?.phone||'')}"></div>
      <div class="form-group"><label>อีเมล</label><input id="aEmail" value="${esc(state.student?.email||'')}"></div>
      <div class="form-group full"><label>ที่อยู่</label></div>
      <div class="form-group"><label>บ้านเลขที่</label><input id="aNo"></div><div class="form-group"><label>หมู่</label><input id="aVillage"></div>
      <div class="form-group"><label>ซอย</label><input id="aSoi"></div><div class="form-group"><label>ถนน</label><input id="aRoad"></div>
      <div class="form-group"><label>ตำบล/แขวง</label><input id="aSubdistrict"></div><div class="form-group"><label>อำเภอ/เขต</label><input id="aDistrict"></div>
      <div class="form-group"><label>จังหวัด</label><input id="aProvince"></div><div class="form-group"><label>รหัสไปรษณีย์</label><input id="aPostal"></div>
      <div class="form-group full"><label>ข้อมูลผู้ปกครองคนที่ 1</label></div>
      <div class="form-group"><label>คำนำหน้า</label><select id="p1Prefix"><option value="">เลือก</option><option>นาย</option><option>นาง</option><option>นางสาว</option></select></div>
      <div class="form-group"><label>ชื่อ-สกุล <span class="required">*</span></label><input id="p1Name"></div>
      <div class="form-group"><label>ความสัมพันธ์</label><input id="p1Relation" placeholder="บิดา / มารดา / ผู้ปกครอง"></div>
      <div class="form-group"><label>อาชีพ</label><input id="p1Occupation"></div>
      <div class="form-group"><label>เบอร์โทร <span class="required">*</span></label><input id="p1Phone"></div>
      <div class="form-group full"><label>ข้อมูลผู้ปกครองคนที่ 2</label></div>
      <div class="form-group"><label>คำนำหน้า</label><select id="p2Prefix"><option value="">เลือก</option><option>นาย</option><option>นาง</option><option>นางสาว</option></select></div>
      <div class="form-group"><label>ชื่อ-สกุล</label><input id="p2Name"></div>
      <div class="form-group"><label>ความสัมพันธ์</label><input id="p2Relation"></div><div class="form-group"><label>อาชีพ</label><input id="p2Occupation"></div><div class="form-group"><label>เบอร์โทร</label><input id="p2Phone"></div>
      <div class="form-group full"><label>ประวัติการศึกษา</label></div>
      <div class="form-group full"><label>โรงเรียนเดิม <span class="required">*</span></label><input id="aSchool"></div>
      <div class="form-group"><label>จังหวัดโรงเรียนเดิม</label><input id="aSchoolProvince"></div>
      <div class="form-group"><label>ปีที่จบ</label><input id="aGradYear" inputmode="numeric"></div>
      <div class="form-group"><label>เกรดเฉลี่ยสะสม (GPA) <span class="required">*</span></label><input id="aGpa" type="number" min="0" max="4" step="0.01"></div>
      <div class="form-group"><label>รหัสนักเรียนเดิม</label><input id="aStudentCode"></div>
      <div class="form-group full"><label>ข้อมูลเพิ่มเติม / ความต้องการพิเศษ</label><textarea id="aSpecial"></textarea></div>
      <div class="form-group"><label>ผู้ติดต่อกรณีฉุกเฉิน</label><input id="aEmergency"></div>
      <div class="form-group"><label>โทรศัพท์ฉุกเฉิน</label><input id="aEmergencyPhone"></div>

  <div class="actions" style="margin-top:12px;flex-wrap:wrap"><button class="btn btn-light" onclick="exportReport('csv')">CSV ผู้สมัคร</button><button class="btn btn-light" onclick="exportReport('xlsx')">Excel ผู้สมัคร</button><button class="btn btn-primary" onclick="exportReport('pdf','all')">PDF ผู้สมัครทั้งหมด</button><button class="btn btn-primary" onclick="exportReport('pdf','eligible')">PDF ผู้มีสิทธิ์สอบ</button><button class="btn btn-success" onclick="exportReport('pdf','selected')">PDF ผ่านการคัดเลือก</button><button class="btn btn-gold" onclick="exportReport('pdf','waitlist')">PDF ตัวสำรอง</button><button class="btn btn-light" onclick="exportReport('pdf','confirmed')">PDF ยืนยันสิทธิ์</button></div></div>`}
async function exportReport(format,type='all'){
  try{const filters={roundId:document.getElementById('reportRound').value};let r;
    if(format==='csv')r=await api('exportApplicationsCsv',[state.staffToken,filters]);
    else if(format==='xlsx')r=await api('exportApplicationsXlsx',[state.staffToken,filters]);
    else r=await api('exportPdf',[state.staffToken,type,filters]);
    downloadDataUrl(r.data,r.fileName);
  }catch(e){}
}
function staffLogout(){state.staffToken=null;state.staff=null;state.dashboardStaff=null;showHome()}
