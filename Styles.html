<style>
@font-face{font-family:THSarabunPSK;src:local('TH Sarabun PSK'),local('TH Sarabun New')}
:root{--navy:#17365d;--navy2:#0f2745;--gold:#b99a5b;--bg:#f4f6f8;--white:#fff;--line:#dce2e8;--text:#1d2733;--muted:#687585;--danger:#b42318;--success:#13795b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:THSarabunPSK,'TH Sarabun PSK','TH Sarabun New',Arial,sans-serif;font-size:19px;line-height:1.35}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);min-height:74px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.logo-box{width:50px;height:50px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}.brand-logo{width:100%;height:100%;object-fit:contain}.brand>div:last-child>div{font-size:23px;font-weight:bold;color:var(--navy)}.brand small{color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:7px;padding:9px 14px;font-family:inherit;font-size:18px;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--navy);color:#fff}.btn-outline{background:#fff;border:1px solid var(--navy);color:var(--navy)}.btn-gold{background:var(--gold);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-light{background:#eef2f6;color:var(--text)}.btn-block{width:100%}
.container{width:min(1180px,calc(100% - 24px));margin:22px auto}.hero{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-radius:12px;padding:28px;min-height:240px;display:flex;align-items:center;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-100px;top:-100px;width:320px;height:320px;border:50px solid rgba(255,255,255,.05);border-radius:50%}.hero h1{font-size:38px;margin:0 0 5px}.hero p{margin:0;max-width:700px}.section-title{font-size:28px;color:var(--navy);margin:22px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(15,39,69,.04)}.card h3{margin:0 0 8px;color:var(--navy);font-size:23px}.notice{border-left:4px solid var(--gold);background:#fff;padding:14px;border-radius:6px;white-space:pre-wrap}.round-card{display:flex;flex-direction:column;gap:8px}.capacity{height:8px;background:#e9edf1;border-radius:20px;overflow:hidden}.capacity>span{display:block;height:100%;background:var(--gold)}
.form-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-weight:bold;color:#344054}.field label span{color:var(--danger)}input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cfd7df;border-radius:6px;font-family:inherit;font-size:18px;background:#fff}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid rgba(23,54,93,.15);border-color:var(--navy)}.help{font-size:15px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.required:after{content:' *';color:var(--danger)}
.portal{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 75px)}.sidebar{background:var(--navy2);color:#fff;padding:15px;position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto}.sidebar h3{font-size:22px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.15)}.nav-btn{display:flex;width:100%;border:0;background:transparent;color:#fff;padding:10px;border-radius:6px;margin:3px 0;font-family:inherit;font-size:18px;cursor:pointer;text-align:left;gap:10px}.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,.12)}.content{padding:20px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px}.stat .num{font-size:34px;font-weight:bold;color:var(--navy)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px}.data-table{width:100%;border-collapse:collapse;min-width:850px}.data-table th,.data-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.data-table th{background:#f1f4f7;color:var(--navy);font-weight:bold;position:sticky;top:0}.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:#edf1f5;font-size:15px}.badge.success{background:#e6f6ef;color:var(--success)}.badge.warn{background:#fff4db;color:#8a6100}.badge.danger{background:#fde9e7;color:var(--danger)}.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}.modal.open{display:flex}.modal-box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;padding:20px}.modal-title{font-size:26px;font-weight:bold;color:var(--navy);display:flex;justify-content:space-between;align-items:center}.close{border:0;background:transparent;font-size:26px;cursor:pointer;color:#667085}.drop{border:2px dashed #b9c3cf;border-radius:8px;padding:16px;background:#fafbfc}.file-list{display:grid;gap:8px;margin-top:8px}.file-row{border:1px solid var(--line);border-radius:7px;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:6px;background:#e9edf1;border-radius:20px}.progress span{display:block;height:100%;background:var(--navy);width:0}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.72);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px}.loading.show{display:flex}.spinner{width:38px;height:38px;border:4px solid #dce2e8;border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;padding:25px;color:var(--muted);font-size:15px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}.portal{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}.content{padding:12px}.form-grid,.grid-2{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions .btn{font-size:16px;padding:7px 9px}.brand>div:last-child>div{font-size:19px}.hero h1{font-size:30px}}
@media(max-width:600px){body{font-size:18px}.grid,.stat-grid{grid-template-columns:1fr}.topbar{position:relative;flex-direction:column}.top-actions{width:100%;justify-content:stretch}.top-actions .btn{flex:1}.hero{padding:20px;min-height:210px}.hero h1{font-size:28px}.section-title{font-size:24px}.form-card,.card{padding:14px}.data-table{min-width:760px}}
</style>
